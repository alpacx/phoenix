# Install only together with the opt-in USB administration units.
# Quiesce socket activation so browser polling cannot cancel the updater stop job.
[Service]
ExecStartPre=/usr/bin/systemctl stop phoenix-usb-http.socket phoenix-usb-https.socket phoenix-usb-http.service phoenix-usb-https.service
ExecStopPost=/usr/bin/systemctl start phoenix-usb-http.socket phoenix-usb-https.socket
